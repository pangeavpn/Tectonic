name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 1.26 is what go.mod asks for, and what the PangeaVPN daemon builds the
    # client with. 1.27 is what a node needs: from it net/http serves a
    # connection the node hands it exactly as one it accepted itself, which
    # is what lets a node answer a stranger as any Go web server does and
    # learn its lane opening from its own cover site. Tests that need that
    # skip themselves on 1.26.
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The lane and scheduler goroutines are where a race would hide, and
      # the end-to-end test runs a client and a node in one process.
      - name: Test with the race detector
        run: go test -race ./...

  bench:
    # Its own module, not part of the client or the node, so it needs its
    # own build to stay compiling.
    name: Benchmarks build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache-dependency-path: bench/go.sum
      - name: Build
        working-directory: bench
        run: |
          go vet ./...
          go build ./...
