<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">Tectonic</title>
<desc id="desc">Tectonic: WireGuard across many short-lived TLS lanes. Packets travel unordered across several lanes from the device to the node.</desc>
<style>
  .panel { fill: #fbf9f2; stroke: #ebe5da; }
  .card { fill: #ffffff; stroke: #e1dace; stroke-width: 1.2; }
  .acard { fill: #fbeee6; stroke: #c3562b; stroke-width: 1.4; }
  .outer { fill: #f6e3d8; stroke: #c3562b; stroke-width: 1.6; }
  .slate { fill: #434c59; }
  .ghost { fill: #e9e3d8; stroke: #e1dace; stroke-width: 1; }
  .h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -1.5px; fill: #1e1c1c; }
  .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #1e1c1c; }
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #6d685f; }
  .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 14px; fill: #6d685f; }
  .lbl-a { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #b34d25; }
  .lead { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 17px; fill: #6d685f; }
  .cap { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 1.2px; fill: #9a948a; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #6d685f; }
  .mono-a { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; letter-spacing: 1px; fill: #b34d25; }
  .st { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #ffffff; }
  .ss { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #cdd3dc; }
  .pk { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; }
  .pk-g { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11px; font-weight: 700; fill: #a39c91; }
  .line { stroke: #a39c91; stroke-width: 1.5; fill: none; }
  .dash { stroke: #a39c91; stroke-width: 1.3; stroke-dasharray: 4 4; fill: none; }
  .region { fill: none; stroke: #cfc7ba; stroke-width: 1.3; stroke-dasharray: 6 5; }
  .lane { stroke: #c3562b; stroke-width: 3; fill: none; stroke-linecap: round; }
  .lane-new { stroke: #c3562b; stroke-width: 3; fill: none; stroke-dasharray: 2 7; stroke-linecap: round; }
  .lane-old { stroke: #a39c91; stroke-width: 3; fill: none; opacity: .55; stroke-linecap: round; }
  .pipe { fill: none; stroke: #e1dace; stroke-width: 1.2; }
  .acc-fill { fill: #c3562b; }
  .line-fill { fill: #a39c91; }
  .x { stroke: #d64545; stroke-width: 2.6; stroke-linecap: round; }
  .icon { stroke: #6d685f; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-a { stroke: #b34d25; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" class="line-fill"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L9,5 L0,9 z" class="acc-fill"/>
  </marker>
</defs>
<rect class="panel" x="0.5" y="0.5" width="959" height="269" rx="18"/>
<text class="cap" x="56" y="78">PANGEAVPN  ·  TRANSPORT PROTOCOL</text>
<text class="h" x="52" y="140">Tectonic</text>
<text class="lead" x="56" y="178">WireGuard across many short-lived TLS lanes.</text>
<text class="lead" x="56" y="202">Fast, unordered, and unremarkable on the wire.</text>
<path class="lane-new" d="M560,130 C 670,70 770,92 900,130"/>
<path class="lane" d="M560,130 C 670,112 770,120 900,130"/>
<path class="lane" d="M560,130 C 670,150 770,146 900,130"/>
<path class="lane-old" d="M560,130 C 670,190 770,174 900,130"/>
<rect class="slate" x="647.0" y="87" width="26" height="18" rx="5"/><text class="pk" x="660" y="100" text-anchor="middle">3</text>
<rect class="slate" x="777.0" y="95" width="26" height="18" rx="5"/><text class="pk" x="790" y="108" text-anchor="middle">6</text>
<rect class="slate" x="687.0" y="113" width="26" height="18" rx="5"/><text class="pk" x="700" y="126" text-anchor="middle">1</text>
<rect class="slate" x="807.0" y="115" width="26" height="18" rx="5"/><text class="pk" x="820" y="128" text-anchor="middle">4</text>
<rect class="slate" x="667.0" y="137" width="26" height="18" rx="5"/><text class="pk" x="680" y="150" text-anchor="middle">2</text>
<rect class="slate" x="787.0" y="137" width="26" height="18" rx="5"/><text class="pk" x="800" y="150" text-anchor="middle">5</text>
<circle class="slate" cx="560" cy="130" r="14"/>
<circle class="acard" cx="900" cy="130" r="14"/>
<text class="cap" x="560" y="236" text-anchor="middle">DEVICE</text>
<text class="cap" x="900" y="236" text-anchor="middle">NODE</text>
</svg>
